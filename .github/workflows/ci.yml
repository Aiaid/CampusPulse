name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify compact vehicle evidence with C sanitizers
        run: sh firmware/tests/run-vehicle.sh
      - run: npm run build
      - name: Verify ingestion against local workerd D1 and R2
        run: node scripts/ingest-runtime-smoke.mjs
      - name: Verify device v2 against local workerd D1 and R2
        run: node scripts/device-v2-runtime-smoke.mjs
      - name: Verify MQTT gateway protocol, registry RPC and replay bounds
        run: |
          node --test relay/emqx-cloud/test/*.test.mjs
          node_modules/.bin/tsc -p relay/emqx-cloud/tsconfig.json
      - name: Verify production MQTT settings and firmware ownership on host
        run: |
          sh firmware/components/cp_settings/tests/run-host.sh
          sh firmware/components/cp_network/tests/run-host.sh
          sh firmware/tests/runtime/run-host.sh
      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
      - name: Verify protected provisioning wizard with synthetic peers
        run: node scripts/provisioning-browser-smoke.mjs
      - name: Verify MQTT pool and enrollment workflow with synthetic peers
        run: node scripts/mqtt-enrollment-browser-smoke.mjs
      - name: Verify private device diagnostics and uploaded evidence
        run: node scripts/device-diagnostics-browser-smoke.mjs
      - name: Verify multi-purpose places and existing-device deployment edits
        run: node scripts/place-purposes-browser-smoke.mjs
      - name: Verify automatic candidate and historical-wait projections
        run: node scripts/automatic-observations-browser-smoke.mjs
      - name: Verify observed people, vehicles and elevator diagrams
        run: node scripts/field-illustration-browser-smoke.mjs
      - name: Verify capture correction and deployment retry workflows
        run: node scripts/config-editing-browser-smoke.mjs
      - name: Prepare local database and disposable operator/admin credentials
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {randomBytes} from 'node:crypto'; writeFileSync('.dev.vars',['OPERATOR_TOKEN='+randomBytes(32).toString('hex'),'ADMIN_TOKEN='+randomBytes(32).toString('hex'),'RESEARCH_TOKEN='+randomBytes(32).toString('hex'),'MQTT_PROVISIONING_KEY='+randomBytes(32).toString('base64url'),'ADMIN_SMOKE_USERNAME=ci-admin','ADMIN_SMOKE_PASSWORD='+randomBytes(24).toString('hex'),'ADMIN_SMOKE_NEW_USERNAME=ci-admin-updated','ADMIN_SMOKE_NEW_PASSWORD='+randomBytes(24).toString('hex')].join('\n')+'\n',{mode:0o600});"
          npm run db:migrate
          CAMPUSPULSE_LOCAL_MQTT_FIXTURES=synthetic node scripts/seed-mqtt-browser-fixtures.mjs
      - name: Check browser against local Worker
        env:
          SMOKE_GIS: offline
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run dev:api > /tmp/campuspulse-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/api/v1/health > /dev/null; then break; fi
            echo "Waiting for local Worker ($attempt/45)"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/v1/health > /dev/null
          npm run test:browser
          FIELD_DATA_URL=http://127.0.0.1:8787 node scripts/field-data-browser-smoke.mjs
          SIMULATION_URL=http://127.0.0.1:8787 node scripts/simulation-browser-smoke.mjs
          node scripts/docs-browser-smoke.mjs
          ADMIN_SMOKE_URL=http://localhost:8787 node scripts/admin-auth-browser-smoke.mjs
          ADMIN_SMOKE_URL=http://localhost:8787 node scripts/admin-browser-smoke.mjs
          GIS_SMOKE_URL=http://127.0.0.1:8787 GIS_SMOKE_TILES=fixture node scripts/gis-location-browser-smoke.mjs
          node scripts/admin-gis-csp-browser-smoke.mjs

  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      vars.CLOUDFLARE_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: campuspulse-production
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_R2_RAW_BUCKET: ${{ vars.CLOUDFLARE_R2_RAW_BUCKET }}
      DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
      ADMIN_WEBAUTHN_ORIGIN: ${{ vars.ADMIN_WEBAUTHN_ORIGIN }}
      ADMIN_WEBAUTHN_RP_ID: ${{ vars.ADMIN_WEBAUTHN_RP_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure the CLOUDFLARE_API_TOKEN Actions secret before enabling deployment.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_R2_RAW_BUCKET" ]; then
            echo '::error::Configure the private CLOUDFLARE_R2_RAW_BUCKET before deploying ingestion.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: node scripts/cloudflare-config.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply campuspulse --remote --config .wrangler/deploy/wrangler.json
      - name: Deploy Worker API and static frontend together
        run: npx wrangler deploy --config .wrangler/deploy/wrangler.json
      - name: Prepare MQTT gateway deployment
        if: vars.CLOUDFLARE_MQTT_ROLLOUT_READY == 'true'
        run: node scripts/cloudflare-mqtt-config.mjs
      - name: Deploy MQTT gateway using retained Worker secrets
        if: vars.CLOUDFLARE_MQTT_ROLLOUT_READY == 'true'
        run: npx wrangler deploy --config .wrangler/deploy/mqtt-wrangler.json
      - name: Verify published frontend, API and D1
        run: node scripts/deployment-smoke.mjs
